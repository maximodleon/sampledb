name: Build and Test
on:
  push:
    branches: [ "main" ]
jobs:
  build-and-test:
    name: Build and test on ${{ matrix.os }} with Meson ${{ matrix.meson_version }}
    runs-on:  {{ matrix.os }}
    strategy:
      os: [ubuntu-latest, macos-latest, windows-latest]
      meson_version: ["1.2.0", "1.3.0", "1.4.0"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup pythong
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: python -m pip-install meson==${{ matrix.meson_version }} ninja
      - name: Configure project
        working-directory: ./tests
        run: meson setup testdir
        env:
          CC: gcc
      - name: Ninja build
        working-directory: ./tests/testdir
        run: ninja
      - name: Run tests
        working-directory: ./tests/testdir
        run: ./tests
